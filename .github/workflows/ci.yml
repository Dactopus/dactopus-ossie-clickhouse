name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  OSSIE_CLICKHOUSE_REQUIRED: 1  # a missing server or database fails the run instead of skipping

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        volumes:
          # Outside the workspace: actions/checkout recreates the workspace directory,
          # which detaches a bind mount made there. (runner.temp is not allowed here.)
          - /tmp/tpcds:/var/lib/clickhouse/user_files/tpcds
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check src tests research scripts
      - run: uv run ruff format --check src tests research scripts
      - run: uv run python scripts/vendor_ossie.py --check  # _vendor/ossie is upstream's, unchanged
      - name: Load the TPC-DS reference data (see CONTRIBUTING.md)
        run: |
          sudo chmod a+rwx /tmp/tpcds  # docker made the bind mount root-owned
          uv run python -c "
          import duckdb; c = duckdb.connect(); c.execute('INSTALL tpcds; LOAD tpcds; CALL dsdgen(sf=1)')
          for t in ['store_sales', 'date_dim', 'customer', 'item', 'store']:
              c.execute(f\"COPY {t} TO '/tmp/tpcds/{t}.parquet' (FORMAT PARQUET)\")"
          curl -sS --fail-with-body http://127.0.0.1:8123 --data-binary "CREATE DATABASE tpcds"
          for t in store_sales date_dim customer item store; do
            curl -sS --fail-with-body http://127.0.0.1:8123 --data-binary "CREATE TABLE tpcds.$t ENGINE = MergeTree ORDER BY tuple() AS SELECT * FROM file('tpcds/$t.parquet', Parquet)"
          done
      - run: uv run pytest -q

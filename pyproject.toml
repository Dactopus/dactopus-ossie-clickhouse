[project]
name = "dactopus-ossie-clickhouse"
version = "0.10.1"
description = "Apache Ossie semantic model implementation for ClickHouse"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex Kosachev" }]
requires-python = ">=3.11"
keywords = ["clickhouse", "semantic-layer", "ossie", "mcp", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    # Not on PyPI yet; pinned to the Ossie main revision the code was written against.
    "apache-ossie @ git+https://github.com/apache/ossie.git@7205e15#subdirectory=python",
    "PyYAML>=6,<7",
    # Upper bounds: the translator builds on SQLGlot AST classes and parser
    # internals, and clickhouse-connect's client options; both move between majors.
    "sqlglot>=30.24,<31",
    "clickhouse-connect>=1,<2",
]

[project.urls]
Homepage = "https://github.com/Dactopus/dactopus-ossie-clickhouse"
Issues = "https://github.com/Dactopus/dactopus-ossie-clickhouse/issues"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
dactopus-ossie-clickhouse = "dactopus_ossie_clickhouse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "duckdb>=1.0", "mcp>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dactopus_ossie_clickhouse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_catalog.py" = ["E501"]  # one catalog entry per line reads better than wrapped tuples

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a reachable ClickHouse (skipped otherwise)"]
